# Tunables for the Revenue Recovery Agent.
# Code reads these values; code never embeds them.
# Day 1: placeholder values. Tune during Day 3 (score) and Day 6 (brain).

version: 1

# --- Buyer score weights (engine/score.py) --------------------------------
# score = base - (avg_delay_days * avg_delay_penalty)
#              - (broken_promises * broken_promise_penalty)
#              - (disputes_raised * dispute_penalty)
#              + (on_time_streak * on_time_bonus)
# clamped to [min, max]
score:
  base: 100
  min: 0
  max: 100
  weights:
    avg_delay_penalty: 1.2
    broken_promise_penalty: 8
    dispute_penalty: 5
    on_time_bonus: 2
  # Confidence depends on how much history the buyer has.
  confidence:
    low_below_invoices: 3       # fewer than 3 paid invoices -> low
    high_from_invoices: 10      # 10 or more -> high; in between -> medium
  # Score bands used by the brain to pick a starting rung and pacing.
  bands:
    good_from: 80
    poor_below: 50

# --- Escalation ladder (engine/brain.py) ----------------------------------
# Rung 0 WAIT | 1 SOFT NUDGE | 2 FIRM | 3 LEGAL FACTS | 4 STOP + HANDOFF
ladder:
  # Rung ids are SHARED with engine/law.py available_rung(), which returns a
  # CEILING of 1-4. Rung 0 is brain-only and is never returned by law.
  # Invariant enforced in engine/brain.py:
  #     chosen == 0   OR   1 <= chosen <= law.available_rung()
  # The ceiling never forces escalation: a good-score buyer three days overdue
  # has a ceiling of 2 and the brain may still choose 1.
  #
  # allowed_facts names keys in the facts block of config/legal.yaml. A rung
  # may state those and nothing else.
  rungs:
    - id: 0
      name: wait
      intent: "an active promise has not yet fallen due; say nothing"
      max_messages: 0
      min_days_between_contacts: 0
      allowed_facts: []

    - id: 1
      name: soft_nudge
      intent: "courtesy reminder; no legal content of any kind"
      max_messages: 2
      min_days_between_contacts: 5
      allowed_facts: []

    - id: 2
      name: firm
      intent: "state the statutory due date and the interest now accruing"
      max_messages: 3
      min_days_between_contacts: 4
      allowed_facts:
        - section_15_no_agreement
        - section_15_agreed
        - section_15_capped
        - section_16
        - section_16_running

    - id: 3
      name: legal_facts
      intent: "add the buyer's own tax cost and their disclosure obligation"
      max_messages: 3
      min_days_between_contacts: 4
      allowed_facts:
        - section_15_no_agreement
        - section_15_agreed
        - section_15_capped
        - section_16
        - section_16_running
        - section_22
        - section_23
        - tax_deduction_upcoming
        - tax_deduction_crystallised

    - id: 4
      name: stop_handoff
      intent: "stop contacting the buyer; draft the reference, flag a human"
      # Zero: no message goes to the buyer at this rung. The facts below are
      # for the Samadhaan draft and the handoff note only.
      max_messages: 0
      min_days_between_contacts: 0
      allowed_facts:
        - section_15_no_agreement
        - section_15_agreed
        - section_15_capped
        - section_16
        - section_16_running
        - section_22
        - section_23
        - tax_deduction_upcoming
        - tax_deduction_crystallised
        - samadhaan

  # Starting rung and days between rungs, by score band.
  pacing:
    good:                       # score >= score.bands.good_from
      start_rung: 1
      days_between_rungs: 7
    medium:
      start_rung: 1
      days_between_rungs: 5
    poor:                       # score < score.bands.poor_below
      start_rung: 2
      days_between_rungs: 4
  # A score built on almost no history is not evidence. With low confidence we
  # neither extend the benefit of the doubt nor presume habitual delay -- the
  # buyer is paced as an ordinary one until we know more. Applied in both
  # directions on purpose: two late invoices is no more proof of a habitual
  # delayer than two prompt ones is proof of a good payer.
  # Set to null to pace purely on score.
  low_confidence_band: medium

  # A promise that comes and goes unpaid moves the case up one rung.
  broken_promise_rung_jump: 1
  # Days of silence after a fresh promise before we speak again.
  promise_grace_days: 1

# --- Hard stopping rules (enforced in code, never by the LLM) -------------
stop_rules:
  max_per_rung: 3
  max_total: 5
  quiet_hours:
    start: "21:00"              # no messages from 21:00 ...
    end: "09:00"                # ... until 09:00, buyer local time
  send_on_weekends: false
  opt_out_stops_everything: true
  dispute_triggers_handoff: true

# --- When a legal fact becomes worth stating (engine/law.py) --------------
# These are OUR conservatism policy, not statute, which is why they live here
# and not in config/legal.yaml -- that file stays purely statutory so it can be
# audited as such. Legally a delayed-payment reference can be made as soon as
# payment is overdue; we wait longer.
law_gates:
  # How close the 31 March deduction cliff has to be before the tax point is
  # material enough to raise. Also satisfied once the year end has passed.
  tax_horizon_days: 90
  # How overdue an invoice must be before we will mention Samadhaan at all.
  samadhaan_after_days: 45
  # How far forward to quote the cost of continuing to wait. A static
  # interest figure reads as a fine for the past; the same arithmetic run
  # forward is the price of the next decision.
  waiting_horizon_days: 7

# --- Channels (engine/channels.py) ----------------------------------------
channels:
  email: real                   # actually sent, only to TEST_INBOX_EMAIL
  whatsapp: stub                # logs "would send"
  sms: stub                     # logs "would send"
