# Tunables for the Revenue Recovery Agent.
# Code reads these values; code never embeds them.
# Day 1: placeholder values. Tune during Day 3 (score) and Day 6 (brain).

version: 1

# --- Buyer score weights (engine/score.py) --------------------------------
# score = base - (avg_delay_days * avg_delay_penalty)
#              - (broken_promises * broken_promise_penalty)
#              - (disputes_raised * dispute_penalty)
#              + (on_time_streak * on_time_bonus)
# clamped to [min, max]
score:
  base: 100
  min: 0
  max: 100
  weights:
    avg_delay_penalty: 1.2
    broken_promise_penalty: 8
    dispute_penalty: 5
    on_time_bonus: 2
  # Confidence depends on how much history the buyer has.
  confidence:
    low_below_invoices: 3       # fewer than 3 paid invoices -> low
    high_from_invoices: 10      # 10 or more -> high; in between -> medium
  # Score bands used by the brain to pick a starting rung and pacing.
  bands:
    good_from: 80
    poor_below: 50

# --- Escalation ladder (engine/brain.py) ----------------------------------
# Rung 0 WAIT | 1 SOFT NUDGE | 2 FIRM | 3 LEGAL FACTS | 4 STOP + HANDOFF
ladder:
  # Rung ids are SHARED with engine/law.py available_rung(), which returns a
  # CEILING of 1-4. Rung 0 is brain-only and is never returned by law.
  # Invariant enforced in engine/brain.py:
  #     chosen == 0   OR   1 <= chosen <= law.available_rung()
  # The ceiling never forces escalation: a good-score buyer three days overdue
  # has a ceiling of 2 and the brain may still choose 1.
  #
  # allowed_facts names keys in the facts block of config/legal.yaml. A rung
  # may state those and nothing else.
  rungs:
    - id: 0
      name: wait
      intent: "an active promise has not yet fallen due; say nothing"
      max_messages: 0
      min_days_between_contacts: 0
      allowed_facts: []

    - id: 1
      name: soft_nudge
      intent: "courtesy reminder; no legal content of any kind"
      max_messages: 2
      min_days_between_contacts: 5
      allowed_facts: []

    - id: 2
      name: firm
      intent: "state the statutory due date and the interest now accruing"
      max_messages: 3
      min_days_between_contacts: 4
      allowed_facts:
        - section_15_no_agreement
        - section_15_agreed
        - section_15_capped
        - section_16
        - section_16_running

    - id: 3
      name: legal_facts
      intent: "add the buyer's own tax cost and their disclosure obligation"
      max_messages: 3
      min_days_between_contacts: 4
      allowed_facts:
        - section_15_no_agreement
        - section_15_agreed
        - section_15_capped
        - section_16
        - section_16_running
        - section_22
        - section_23
        - tax_deduction_upcoming
        - tax_deduction_crystallised

    - id: 4
      name: stop_handoff
      intent: "stop contacting the buyer; draft the reference, flag a human"
      # Zero: no message goes to the buyer at this rung. The facts below are
      # for the Samadhaan draft and the handoff note only.
      max_messages: 0
      min_days_between_contacts: 0
      allowed_facts:
        - section_15_no_agreement
        - section_15_agreed
        - section_15_capped
        - section_16
        - section_16_running
        - section_22
        - section_23
        - tax_deduction_upcoming
        - tax_deduction_crystallised
        - samadhaan

  # Starting rung and days between rungs, by score band.
  pacing:
    good:                       # score >= score.bands.good_from
      start_rung: 1
      days_between_rungs: 7
    medium:
      start_rung: 1
      days_between_rungs: 5
    poor:                       # score < score.bands.poor_below
      start_rung: 2
      days_between_rungs: 4
  # A score built on almost no history is not evidence. With low confidence we
  # neither extend the benefit of the doubt nor presume habitual delay -- the
  # buyer is paced as an ordinary one until we know more. Applied in both
  # directions on purpose: two late invoices is no more proof of a habitual
  # delayer than two prompt ones is proof of a good payer.
  # Set to null to pace purely on score.
  low_confidence_band: medium

  # A promise that comes and goes unpaid moves the case up one rung.
  broken_promise_rung_jump: 1
  # Days of silence after a fresh promise before we speak again.
  promise_grace_days: 1

# --- Promise sanity bounds (engine/promises.py) ----------------------------
# A structurally valid promise can still be semantically absurd -- see
# docs/edge_cases.md TC-001, TC-002, TC-011, TC-043. These bounds catch that
# before a promise is ever stored. Neither invents nor corrects the buyer's
# words: a promise that fails a bound is downgraded to a question, the same
# way an unresolvable or already-past date already is -- never silently
# dropped, never assumed on the buyer's behalf.
promises:
  # A promise dated further out than this is not a commitment worth
  # tracking -- it would buy the buyer years of silence for no more
  # information than an unresolvable date already gives. Set comfortably
  # past every other horizon in this file (tax_horizon_days 90,
  # samadhaan_after_days 45, sim/run_sim.py's own 120-day run) so a genuine
  # "next quarter" MSME promise still clears it.
  max_horizon_days: 120
  # A stated amount at or above this multiple of what is actually
  # outstanding is treated as implausible rather than trusted at face value.
  # Deliberately coarse: free-text lakh/crore/Rs parsing (engine/promises.py
  # _extract_amount_paise) is a trip-wire for wild disproportion, not a
  # ledger-grade balance check, so the margin above 1.0 exists only to
  # tolerate genuine noise (e.g. a buyer folding in accrued interest), not
  # to wave through a figure that is actually implausible.
  amount_implausible_multiple: 1.2

# --- Invoice structural validation (engine/validate.py) --------------------
# A malformed invoice must never reach engine/law.py or engine/brain.py
# unnoticed -- see docs/edge_cases.md TC-045, TC-049, TC-050, TC-051, TC-053,
# TC-054. Most of these checks are structural invariants with no meaningful
# "how much is too much" (an invoice cannot have a negative amount, full
# stop) -- only these two are genuinely tunable, so only these two live here.
validation:
  # An invoice amount at or below this is not a receivable worth chasing.
  min_amount_paise: 1
  # How many days into the future an issue_date may sit before it is treated
  # as a data error rather than genuine advance invoicing. 0 means "must not
  # be later than today at all."
  future_issue_date_grace_days: 0

# --- Hard stopping rules (enforced in code, never by the LLM) -------------
stop_rules:
  max_per_rung: 3
  max_total: 5
  quiet_hours:
    start: "21:00"              # no messages from 21:00 ...
    end: "09:00"                # ... until 09:00, buyer local time
  send_on_weekends: false
  opt_out_stops_everything: true
  dispute_triggers_handoff: true

# --- When a legal fact becomes worth stating (engine/law.py) --------------
# These are OUR conservatism policy, not statute, which is why they live here
# and not in config/legal.yaml -- that file stays purely statutory so it can be
# audited as such. Legally a delayed-payment reference can be made as soon as
# payment is overdue; we wait longer.
law_gates:
  # How close the 31 March deduction cliff has to be before the tax point is
  # material enough to raise. Also satisfied once the year end has passed.
  tax_horizon_days: 90
  # How overdue an invoice must be before we will mention Samadhaan at all.
  samadhaan_after_days: 45
  # How far forward to quote the cost of continuing to wait. A static
  # interest figure reads as a fine for the past; the same arithmetic run
  # forward is the price of the next decision.
  waiting_horizon_days: 7

# --- Which model answers which question (engine/llm.py) -------------------
# ARCHITECTURE.md makes this call explicitly: a cheaper, faster model for
# high-volume reply parsing, a stronger one for prose a buyer will read.
# Credentials never appear here -- only in .env.
#
# CONFIRM THESE IDS with `python engine/llm.py --list-models` before relying
# on them. They were taken from published pricing pages, not from the model
# list your key can actually reach.
llm:
  models:
    draft_message: "gemini-3.7-flash"
    judgment_call: "gemini-3.7-flash"
    parse_reply: "gemini-3.7-flash"
  max_tokens:
    draft_message: 2000
    parse_reply: 600
    judgment_call: 600

  # Content-safety thresholds, set explicitly rather than left at default.
  # A rung 3 message states statutory interest, a tax-deduction deadline and a
  # Facilitation Council reference -- entirely legitimate, and exactly the
  # shape of text a generic filter can read as coercive.
  #
  # BLOCK_ONLY_HIGH, deliberately NOT off. Our own guardrail is stricter and
  # far more specific than a generic filter: it bans threatening phrases
  # outright and rejects any figure that did not come from the law engine.
  # This is the loosest setting that still catches something genuinely wrong.
  safety:
    HARM_CATEGORY_HARASSMENT: BLOCK_ONLY_HIGH
    HARM_CATEGORY_HATE_SPEECH: BLOCK_ONLY_HIGH
    HARM_CATEGORY_SEXUALLY_EXPLICIT: BLOCK_ONLY_HIGH
    HARM_CATEGORY_DANGEROUS_CONTENT: BLOCK_ONLY_HIGH

# --- Message writer (engine/writer.py) ------------------------------------
writer:
  # Hinglish is offered only to these buyer profiles. A corporate accounts
  # desk gets English whatever the stated preference: a WhatsApp register to
  # a finance team reads as unprofessional, not friendly.
  hinglish_profiles:
    - small_trader
  # How many times a draft may be regenerated after failing the guardrail
  # before we fall back to the plain factual skeleton.
  regeneration_attempts: 1

# --- Channels (engine/channels.py) ----------------------------------------
channels:
  email: real                   # actually sent, only to TEST_INBOX_EMAIL
  whatsapp: stub                # logs "would send"
  sms: stub                     # logs "would send"
  # Host and port are configuration; the credentials are only ever in .env.
  smtp_host: "smtp.gmail.com"
  smtp_port: 587
  smtp_timeout_seconds: 20
  # Why the stubs are stubs. Quoted verbatim into the audit trail so the scope
  # call is recorded where a reviewer will actually see it.
  stub_reasons:
    whatsapp: >-
      the WhatsApp Business API needs business verification, which is out of
      scope for this build
    sms: >-
      an SMS gateway needs a registered sender ID and DLT templates, which is
      out of scope for this build
