# Message scaffolding for engine/writer.py.
#
# ############################################################################
# #  NO LEGAL PROSE AND NO LEGAL FIGURES BELONG IN THIS FILE.                #
# #                                                                          #
# #  Every legal sentence arrives as a {fact_*} placeholder, already          #
# #  rendered from the clauses block of config/legal.yaml -- the same         #
# #  wording the Samadhaan draft uses. Templates here carry only connective   #
# #  tissue: greetings, framing, closings.                                    #
# #                                                                          #
# #  tests/test_writer.py fails this file if it contains a percentage, a      #
# #  currency figure, or a statute citation.                                  #
# ############################################################################

version: 1

# --- what a message may never say ----------------------------------------
# Checked case-insensitively against the drafted body. The agent states facts;
# it does not threaten. This is the last automated barrier before a message
# would reach a buyer.
threat_words:
  - "legal action"
  - "take action against"
  - "sue"
  - "lawsuit"
  - "court"
  - "litigation"
  - "police"
  - "criminal"
  - "blacklist"
  - "defaulter"
  - "credit rating"
  - "credit score"
  - "recovery agent"
  - "seize"
  - "confiscate"
  - "penalty"
  # "fine" is deliberately absent: "we would be fine with a part payment"
  # is a sentence we want, and a false rejection pushes the message down to
  # the plainer fallback. "penalty" covers the meaning that matters.
  - "consequences"
  - "failure to comply"
  - "final warning"
  - "last warning"
  - "or else"
  - "liable to"
  - "we will be forced"
  - "failing which"
  - "immediately or"

# --- what a rung 1 courtesy nudge may never say --------------------------
# A reminder that mentions the Act is not a courtesy reminder. These are
# checked in addition to the citation patterns the guardrail applies.
rung_one_banned_words:
  - "interest"
  - "statutory"
  - "legal"
  - "tax"
  - "deduction"
  - "overdue"

# --- referencing a promise that was made and missed -----------------------
# Connective tissue, not a legal statement. The date and the words come from
# the stored promise record, so nothing here is invented.
promise_reference:
  english: >-
    On {promised_on} you committed to clearing this by {promised_date}
    ("{promise_quote}"). That date has now passed.
  hinglish: >-
    {promised_on} ko aapne {promised_date} tak clear karne ko bola tha
    ("{promise_quote}"). Woh date nikal gayi.

# --- tone, by profile and score band --------------------------------------
tone:
  corporate:
    good: "businesslike and courteous; assume this is an oversight in their payables run"
    medium: "businesslike and direct"
    poor: "businesslike and firm, still entirely respectful"
  small_trader:
    good: "warm and personal; assume this simply slipped"
    medium: "friendly but direct"
    poor: "direct and firm, still respectful"

language_instruction:
  english: >-
    Write in plain professional Indian business English. Short paragraphs.
  hinglish: >-
    Write in natural Hinglish as used in Indian business WhatsApp -- Roman
    script, Hindi sentence structure, English for business and legal terms.
    Address the reader as Sir. Keep it short and warm. Do NOT translate any
    sentence that has been supplied to you as a fact; reproduce those in
    English exactly as given.

# --- mock model output, one per rung and language -------------------------
# What the model "returns" when LLM_MODE=mock. Placeholders are substituted by
# engine/writer.py after the call, so mock output travels the same guardrail
# path as a live draft.
#
# Available: {invoice_id} {goods} {outstanding} {days_overdue}
#            {statutory_due_date} {interest} {per_day} {tax_exposure}
#            {contact_name} {buyer_name} {supplier_name} {supplier_contact}
#            {fact_section_15} {fact_section_16} {fact_section_16_running}
#            {fact_section_22} {fact_section_23} {fact_tax}
mock_drafts:
  rung1_english:
    subject: "Invoice {invoice_id} — payment reminder"
    body: |
      Dear {contact_name},

      I hope you are well. Our invoice {invoice_id} for {outstanding}
      ({goods}) is still showing as outstanding on our side.

      Could you let me know when we might expect it, or if anything is holding
      it up? Happy to resend paperwork if that helps.

      Thanks very much,
      {supplier_contact}
      {supplier_name}

  rung1_hinglish:
    subject: "Invoice {invoice_id} ka payment — reminder"
    body: |
      Sir,

      {invoice_id} ka payment {outstanding} abhi tak pending hai ({goods}).
      Aap ek baar check karwa lijiye.

      Koi issue ho to bata dijiye, hum dekh lenge. Paperwork dobara bhejna ho
      to bhi bol dijiye.

      Dhanyavaad,
      {supplier_contact}

  rung2_english:
    subject: "Invoice {invoice_id} — {days_overdue} days overdue"
    body: |
      Dear {contact_name},

      Invoice {invoice_id} for {outstanding} ({goods}) was due on
      {statutory_due_date} and is now {days_overdue} days past that date.

      {promise_reference}

      {fact_section_15}

      {fact_section_16} {fact_section_16_running}

      We would much rather settle this before it grows further. Could you
      confirm a date you can work to?

      Regards,
      {supplier_contact}
      {supplier_name}

  rung2_hinglish:
    subject: "{invoice_id} — payment {days_overdue} din se pending"
    body: |
      Sir,

      {invoice_id} ({outstanding}) ka payment {days_overdue} din se pending
      hai. Due date {statutory_due_date} thi.

      {promise_reference}

      {fact_section_16} {fact_section_16_running}

      Request hai ki is hafte clear kar dein, taaki aur na badhe. Koi dikkat
      ho to phone kar lijiye.

      Dhanyavaad,
      {supplier_contact}

  rung3_english:
    subject: "Invoice {invoice_id} — {days_overdue} days overdue, {outstanding} outstanding"
    body: |
      Dear {contact_name},

      Invoice {invoice_id} for {outstanding} ({goods}) was due on
      {statutory_due_date} and is now {days_overdue} days past that date.

      {promise_reference}

      {fact_section_15}

      {fact_section_16} {fact_section_16_running}

      There is also a cost to you in holding it. {fact_tax}

      {fact_section_22} {fact_section_23}

      None of this is where either of us wants to be. If you can confirm a
      payment date this week, that closes it.

      Regards,
      {supplier_contact}
      {supplier_name}

  rung3_hinglish:
    subject: "{invoice_id} — {outstanding} pending, {days_overdue} din"
    body: |
      Sir,

      {invoice_id} ({outstanding}) ka payment {days_overdue} din se pending
      hai. Due date {statutory_due_date} thi.

      {promise_reference}

      {fact_section_16} {fact_section_16_running}

      Ek baat aur — is delay ka kharcha aapko bhi padta hai. {fact_tax}

      {fact_section_22}

      Hum dono ke liye behtar yehi hai ki yeh settle ho jaaye. Is hafte ek
      date confirm kar dijiye to baat khatam.

      Dhanyavaad,
      {supplier_contact}

  # Consolidated (buyer-level) drafts -- kept in this same mapping, not a
  # separate top-level key, so engine/llm.py's mock lookup (one door, keyed
  # by variant name only) needs no change to find them. {sections} is
  # pre-built by engine/writer.py by joining each invoice's own
  # consolidated_section text below.
  consolidated_courtesy_english:
    subject: "{invoice_count} invoices with us — a quick check"
    body: |
      Dear {contact_name},

      A quick note on {invoice_count} invoices currently outstanding with us:

      {sections}

      Could you let us know when we might expect these, or if anything is
      holding them up?

      Thanks very much,
      {supplier_contact}
      {supplier_name}

  consolidated_courtesy_hinglish:
    subject: "{invoice_count} invoices ka payment — reminder"
    body: |
      Sir,

      {invoice_count} invoices abhi tak pending hain:

      {sections}

      Aap ek baar check karwa lijiye.

      Dhanyavaad,
      {supplier_contact}

  consolidated_escalated_english:
    subject: "{invoice_count} invoices outstanding"
    body: |
      Dear {contact_name},

      {invoice_count} invoices are currently outstanding with us:

      {sections}

      We would much rather settle these before they grow further. Could you
      confirm dates you can work to for each?

      Regards,
      {supplier_contact}
      {supplier_name}

  consolidated_escalated_hinglish:
    subject: "{invoice_count} invoices pending"
    body: |
      Sir,

      {invoice_count} invoices abhi tak pending hain:

      {sections}

      Request hai ki inhe jald clear kar dein, taaki aur na badhe.

      Dhanyavaad,
      {supplier_contact}

# --- consolidated (buyer-level) messages -----------------------------------
# One buyer, several invoices, one envelope. Wrapper text (greeting, closing,
# subject) is shared and generic -- deliberately no computed total or digest
# figure in the subject (that's deferred, see CLAUDE.md W3 notes). {sections}
# holds one block per invoice, each built from that invoice's own
# already-approved skeleton content, same principle as the single-invoice
# fallback below: nothing here invents a fact. courtesy sections carry no
# legal content (rung 1); factual sections carry that invoice's own {facts}.
consolidated_section:
  english:
    courtesy: |
      Invoice {invoice_id} — {outstanding} ({goods})
    factual: |
      Invoice {invoice_id} — {outstanding} ({goods}), due {statutory_due_date},
      {days_overdue} days past that date.

      {facts}
  hinglish:
    courtesy: |
      Invoice {invoice_id} — {outstanding} ({goods})
    factual: |
      Invoice {invoice_id} — {outstanding} ({goods}). Due date
      {statutory_due_date} thi, {days_overdue} din ho chuke hain.

      {facts}

# --- the consolidated fallback ----------------------------------------------
# Used when a drafted consolidated message fails the guardrail twice.
# Deliberately plain, exactly like the single-invoice fallback below: it
# assembles only the invoices' own approved section content, so it cannot
# fail the checks a drafted version failed.
fallback_consolidated:
  english:
    courtesy:
      subject: "{invoice_count} invoices — a quick check"
      body: |
        Dear {contact_name},

        This is a reminder about {invoice_count} invoices currently
        outstanding with us:

        {sections}

        Please let us know when we can expect these.

        Regards,
        {supplier_contact}
        {supplier_name}
    factual:
      subject: "{invoice_count} invoices outstanding"
      body: |
        Dear {contact_name},

        This is regarding {invoice_count} invoices currently outstanding
        with us:

        {sections}

        Please let us know when payment can be expected for each.

        Regards,
        {supplier_contact}
        {supplier_name}
  hinglish:
    courtesy:
      subject: "{invoice_count} invoices — a quick check"
      body: |
        Sir,

        {invoice_count} invoices abhi tak pending hain:

        {sections}

        Kab tak ho payega, bata dijiye.

        Dhanyavaad,
        {supplier_contact}
    factual:
      subject: "{invoice_count} invoices pending"
      body: |
        Sir,

        Yeh {invoice_count} invoices ke baare mein hai:

        {sections}

        Payment kab tak ho payega, bata dijiye.

        Dhanyavaad,
        {supplier_contact}

# --- the fallback ---------------------------------------------------------
# Used when a drafted message fails the guardrail twice. Deliberately plain:
# it assembles only the skeleton's own content, so it cannot fail the checks
# that the drafted version failed. Every use is logged to the audit trail.
fallback:
  english:
    # Rung 1: no legal content, so nothing that would fail a courtesy check.
    courtesy:
      subject: "Invoice {invoice_id} — {outstanding}"
      body: |
        Dear {contact_name},

        This is a reminder about invoice {invoice_id} for {outstanding}
        ({goods}), which is still showing as unpaid on our side.

        Please let us know when we can expect it.

        Regards,
        {supplier_contact}
        {supplier_name}
    # Rung 2 and above: must carry every figure the guardrail requires.
    factual:
      subject: "Invoice {invoice_id} — {outstanding}, {days_overdue} days past due"
      body: |
        Dear {contact_name},

        This is regarding invoice {invoice_id} for {outstanding} ({goods}),
        which was due on {statutory_due_date} and is now {days_overdue} days
        past that date.

        {facts}

        Please let us know when payment can be expected.

        Regards,
        {supplier_contact}
        {supplier_name}
  hinglish:
    courtesy:
      subject: "Invoice {invoice_id} — {outstanding}"
      body: |
        Sir,

        {invoice_id} ({outstanding}) ka payment abhi tak pending hai
        ({goods}).

        Kab tak ho payega, bata dijiye.

        Dhanyavaad,
        {supplier_contact}
    factual:
      subject: "Invoice {invoice_id} — {outstanding}, {days_overdue} din"
      body: |
        Sir,

        Yeh invoice {invoice_id} ({outstanding}) ke baare mein hai ({goods}).
        Due date {statutory_due_date} thi, aur {days_overdue} din ho chuke hain.

        {facts}

        Payment kab tak ho payega, bata dijiye.

        Dhanyavaad,
        {supplier_contact}
